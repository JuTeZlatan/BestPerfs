<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi d'exercices</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ec2b1e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exercices">
</head>
<body>
  <div id="splash-screen" class="splash-screen">
    <img src="splash-logo.jpg" alt="Best Perfs" class="splash-logo">
  </div>
  <script>
    setTimeout(function () {
      var splash = document.getElementById("splash-screen");
      splash.classList.add("hide");
      setTimeout(function () { splash.style.display = "none"; }, 400);
    }, 3000);
  </script>

  <div class="app">
    <div class="top-bar">
      <nav id="main-nav" class="main-nav">
        <button class="nav-tab" data-view="timer" data-i18n="nav.toChrono">⏱️ Chrono</button>
        <button class="nav-tab active" data-view="sports" data-i18n="nav.toSports">🏅 Sports</button>
      </nav>

      <div class="lang-switcher">
        <button id="lang-btn" class="lang-btn" data-i18n-title="lang.title"></button>
        <div id="lang-menu" class="lang-menu" hidden>
          <button class="lang-option" data-lang="fr">
            <span class="flag-icon-slot"></span>
            <span>Français</span>
          </button>
          <button class="lang-option" data-lang="en">
            <span class="flag-icon-slot"></span>
            <span>English</span>
          </button>
          <button class="lang-option" data-lang="es">
            <span class="flag-icon-slot"></span>
            <span>Español</span>
          </button>
          <button class="lang-option" data-lang="pt">
            <span class="flag-icon-slot"></span>
            <span>Português</span>
          </button>
          <button class="lang-option" data-lang="zh">
            <span class="flag-icon-slot"></span>
            <span>中文</span>
          </button>
          <button class="lang-option" data-lang="ar">
            <span class="flag-icon-slot"></span>
            <span>العربية</span>
          </button>
        </div>
      </div>
    </div>

    <section id="timer-view" hidden>
      <div class="timer-panel">
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-controls">
          <button id="timer-start-btn" class="timer-btn primary">Démarrer</button>
          <button id="lap-btn" class="timer-btn" data-i18n="timer.lap">Intervalle</button>
          <button id="timer-reset-btn" class="timer-btn" data-i18n="timer.reset">Réinitialiser</button>
        </div>

        <div id="lap-list" class="lap-list"></div>
      </div>

      <h2 class="section-title" data-i18n="presets.sectionTitle">Chronos prédéfinis</h2>

      <form id="add-preset-form" class="add-form">
        <input type="text" id="preset-name-input" data-i18n-placeholder="presets.namePlaceholder" placeholder="Nom (ex: Repos)" maxlength="30" required>
        <input type="number" id="preset-minutes-input" class="preset-time-field" data-i18n-placeholder="presets.minPlaceholder" placeholder="Min" min="0" step="1">
        <input type="number" id="preset-seconds-input" class="preset-time-field" data-i18n-placeholder="presets.secPlaceholder" placeholder="Sec" min="0" max="59" step="1">
        <button type="submit" data-i18n="common.add">Ajouter</button>
      </form>

      <div id="preset-list" class="exercise-list"></div>

      <p id="preset-empty-state" class="empty-state" data-i18n="presets.empty">Aucun chrono enregistré. Ajoute-en un ci-dessous !</p>
    </section>

    <section id="sports-view">
      <header>
        <h1 data-i18n="app.title.sports">🏅 Sports</h1>
        <p class="subtitle" data-i18n="app.subtitle.sports">Choisis une activité et enregistre tes performances.</p>
      </header>

      <div class="sport-dropdown">
        <button id="sport-select-btn" class="sport-select-btn" type="button">
          <span id="sport-select-label"></span>
          <span class="dropdown-arrow">▾</span>
        </button>
        <div id="sport-menu" class="sport-menu" hidden>
          <button class="sport-option" data-sport="course" data-i18n="sport.running">🏃 Course à pied</button>
          <button class="sport-option active" data-sport="fitness" data-i18n="sport.fitness">💪 Fitness</button>
          <button class="sport-option" data-sport="natation" data-i18n="sport.swimming">🏊 Natation</button>
          <button class="sport-option" data-sport="velo" data-i18n="sport.cycling">🚴 Vélo</button>
        </div>
      </div>

      <div id="fitness-panel" class="sport-panel" hidden>
        <form id="add-form" class="add-form">
          <input type="text" id="exercise-input" data-i18n-placeholder="exercise.inputPlaceholder" placeholder="Nom de l'appareil ou exercice (ex: Développé couché)" maxlength="40" required>
          <button type="submit" data-i18n="common.add">Ajouter</button>
        </form>

        <div class="sort-bar">
          <span class="sort-label" data-i18n="sort.label">Trier :</span>
          <button id="sort-asc-btn" class="sort-btn" data-i18n="sort.asc" data-i18n-title="sort.ascTitle" title="Ordre alphabétique croissant">A → Z</button>
          <button id="sort-desc-btn" class="sort-btn" data-i18n="sort.desc" data-i18n-title="sort.descTitle" title="Ordre alphabétique décroissant">Z → A</button>
        </div>

        <div id="exercise-list" class="exercise-list"></div>

        <p id="empty-state" class="empty-state" data-i18n="exercise.empty">Aucun exercice pour l'instant. Ajoute-en un ci-dessous !</p>
      </div>

      <form id="add-swim-form" class="add-form" hidden>
        <input type="text" id="swim-style-input" data-i18n-placeholder="sport.swim.stylePlaceholder" placeholder="Style de nage (ex: Brasse)" maxlength="30" required>
        <input type="number" id="swim-distance-input" class="distance-field" data-i18n-placeholder="field.distanceM" placeholder="Distance (m)" min="0" step="1">
        <input type="number" id="swim-minutes-input" class="preset-time-field" data-i18n-placeholder="presets.minPlaceholder" placeholder="Min" min="0" step="1">
        <input type="number" id="swim-seconds-input" class="preset-time-field" data-i18n-placeholder="presets.secPlaceholder" placeholder="Sec" min="0" max="59" step="1">
        <input type="number" id="swim-hundredths-input" class="preset-time-field" placeholder="00" min="0" max="99" step="1">
        <button type="submit" data-i18n="common.add">Ajouter</button>
      </form>

      <form id="add-cycling-form" class="add-form" hidden>
        <input type="number" id="cycling-distance-input" class="distance-field" data-i18n-placeholder="field.distanceKm" placeholder="Distance (km)" min="0" step="0.1" required>
        <input type="number" id="cycling-hours-input" class="preset-time-field" placeholder="H" min="0" step="1">
        <input type="number" id="cycling-minutes-input" class="preset-time-field" data-i18n-placeholder="presets.minPlaceholder" placeholder="Min" min="0" step="1">
        <input type="number" id="cycling-seconds-input" class="preset-time-field" data-i18n-placeholder="presets.secPlaceholder" placeholder="Sec" min="0" max="59" step="1">
        <button type="submit" data-i18n="common.add">Ajouter</button>
      </form>

      <form id="add-running-form" class="add-form" hidden>
        <input type="text" id="running-desc-input" data-i18n-placeholder="sport.running.descPlaceholder" placeholder="Décris la course (ex: 10 km route)" maxlength="40" required>
        <input type="number" id="running-hours-input" class="preset-time-field" placeholder="H" min="0" step="1">
        <input type="number" id="running-minutes-input" class="preset-time-field" data-i18n-placeholder="presets.minPlaceholder" placeholder="Min" min="0" step="1">
        <input type="number" id="running-seconds-input" class="preset-time-field" data-i18n-placeholder="presets.secPlaceholder" placeholder="Sec" min="0" max="59" step="1">
        <button type="submit" data-i18n="common.add">Ajouter</button>
      </form>

      <div id="sport-list" class="exercise-list"></div>

      <p id="sport-empty-state" class="empty-state" data-i18n="sport.empty">Aucune performance pour l'instant. Ajoute-en une ci-dessous !</p>
    </section>
  </div>

  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <p class="modal-message" id="modal-message">Supprimer cet exercice ?</p>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="modal-btn" data-i18n="modal.cancel">Annuler</button>
        <button id="modal-confirm-btn" class="modal-btn danger" data-i18n="modal.confirm">Supprimer</button>
      </div>
    </div>
  </div>

  <template id="exercise-template">
    <div class="exercise-row">
      <div class="exercise-card">
        <button class="edit-btn" title="Modifier le nom">✏️</button>
        <input type="text" class="exercise-name" maxlength="40" placeholder="Nom de l'exercice" readonly>
        <div class="reps-kg-stack">
          <label class="inline-field">
            <span class="inline-field-label">Reps</span>
            <input type="number" class="reps-input" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">kg</span>
            <input type="number" class="weight-input" min="0" step="0.5" placeholder="0">
          </label>
        </div>
      </div>
      <button class="delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <template id="lap-row-template">
    <div class="lap-row">
      <span class="lap-row-label"></span>
      <span class="lap-row-time"></span>
      <button class="lap-delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <template id="preset-template">
    <div class="exercise-row">
      <div class="exercise-card">
        <button class="edit-btn" title="Modifier le nom">✏️</button>
        <input type="text" class="preset-name" maxlength="30" placeholder="Nom du chrono" readonly>
        <label class="inline-field">
          <span class="inline-field-label">Min</span>
          <input type="number" class="preset-minutes" min="0" step="1">
        </label>
        <label class="inline-field">
          <span class="inline-field-label">Sec</span>
          <input type="number" class="preset-seconds" min="0" max="59" step="1">
        </label>
        <button class="play-btn" title="Démarrer ce chrono">▶</button>
      </div>
      <button class="delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <template id="swim-perf-template">
    <div class="exercise-row">
      <div class="exercise-card">
        <button class="edit-btn" title="Modifier">✏️</button>
        <input type="text" class="perf-text" maxlength="30" placeholder="Style de nage" readonly>
        <div class="reps-kg-stack">
          <label class="inline-field">
            <span class="inline-field-label">m</span>
            <input type="number" class="perf-distance distance-input" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Min</span>
            <input type="number" class="perf-minutes" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Sec</span>
            <input type="number" class="perf-seconds" min="0" max="59" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">00</span>
            <input type="number" class="perf-hundredths" min="0" max="99" step="1" placeholder="0">
          </label>
        </div>
      </div>
      <button class="delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <template id="cycling-perf-template">
    <div class="exercise-row">
      <div class="exercise-card">
        <div class="reps-kg-stack cycling-stack">
          <label class="inline-field">
            <span class="inline-field-label">km</span>
            <input type="number" class="perf-distance distance-input" min="0" step="0.1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">H</span>
            <input type="number" class="perf-hours" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Min</span>
            <input type="number" class="perf-minutes" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Sec</span>
            <input type="number" class="perf-seconds" min="0" max="59" step="1" placeholder="0">
          </label>
        </div>
      </div>
      <button class="delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <template id="running-perf-template">
    <div class="exercise-row">
      <div class="exercise-card">
        <button class="edit-btn" title="Modifier">✏️</button>
        <input type="text" class="perf-text" maxlength="40" placeholder="Description" readonly>
        <div class="reps-kg-stack">
          <label class="inline-field">
            <span class="inline-field-label">H</span>
            <input type="number" class="perf-hours" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Min</span>
            <input type="number" class="perf-minutes" min="0" step="1" placeholder="0">
          </label>
          <label class="inline-field">
            <span class="inline-field-label">Sec</span>
            <input type="number" class="perf-seconds" min="0" max="59" step="1" placeholder="0">
          </label>
        </div>
      </div>
      <button class="delete-btn" title="Supprimer">✕</button>
    </div>
  </template>

  <script src="i18n.js"></script>
  <script src="script.js"></script>
  <script src="timer.js"></script>
  <script src="sports.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
